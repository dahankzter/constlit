[package]
name = "constlit-macros"
description = "Procedural macros for constlit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
litrs = { version = "1", features = ["proc-macro2"] }

[dev-dependencies]
semver = "1"
mime = "0.3"
