[package]
name = "constlit"
description = "Compile-time checked literals: \"1h30m\", \"64 KiB\", \"10.0.0.0/8\", \"2026-10-30 14:00 Europe/Stockholm\", \"512Mi\", \"ghcr.io/org/app:1.2\", \"rwxr-xr-x\" become typed constants, with errors that suggest the fix."
documentation = "https://docs.rs/constlit"
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["literal", "const", "compile-time", "kubernetes", "timezone"]
categories = ["no-std", "no-std::no-alloc", "date-and-time", "network-programming", "rust-patterns"]

[features]
default = ["tz"]
# Named time zones in `ts!`, resolved at compile time from jiff's bundled IANA
# database. Without it, `ts!` takes only `Z` and offsets.
tz = ["constlit-macros/tz"]
ipnet = ["dep:ipnet"]
semver = ["dep:semver"]
# Adds `MediaType::to_mime`. The `mime` crate needs `std`.
mime = ["dep:mime"]
# `Timestamp::to_system_time`.
std = []
# `CronSpec::next_after` for jiff date-times, and conversions of the date and time types to jiff.
jiff = ["dep:jiff"]
# `CronSpec::next_after` for chrono date-times, and conversions of the date and time types to chrono.
chrono = ["dep:chrono"]
# `From<k8s::Quantity>` for k8s-openapi's `Quantity`. Your crate picks the Kubernetes
# version through k8s-openapi's own `v1_*` features, as k8s-openapi requires.
k8s-openapi = ["dep:k8s-openapi"]
# Internal: lets docs.rs and --all-features builds pick a Kubernetes version. Never enable.
__k8s-openapi-latest = ["k8s-openapi/latest"]

[dependencies]
constlit-macros = { path = "../constlit-macros", version = "=0.3.0" }
ipnet = { version = "2", optional = true, default-features = false }
semver = { version = "1", optional = true, default-features = false }
mime = { version = "0.3", optional = true }
jiff = { version = "0.2", optional = true, default-features = false, features = ["alloc"] }
chrono = { version = "0.4", optional = true, default-features = false }
k8s-openapi = { version = "0.29", optional = true }

[dev-dependencies]
libc = "0.2"
trybuild = "1"
ipnet = "2"
semver = "1"
mime = "0.3"
croner = { version = "4", features = ["jiff"] }
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
chrono = "0.4"
chrono-tz = "0.10"
k8s-openapi = { version = "0.29", features = ["latest"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Oracle for the capability table.
caps = "0.5"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
